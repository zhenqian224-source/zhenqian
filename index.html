<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>震纤软件库</title>
  <style>
    /* CSS 部分保持你原来的不变，为了节省篇幅这里不重复贴，你保留原来的 <style> 内容即可 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --primary: #4f46e5; --primary-dark: #4338ca; --accent: #06b6d4; --bg: #f8fafc; --text: #1e293b; --text-light: #64748b; --border: #e2e8f0; --radius: 16px; }
    html { scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
    header { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    nav { max-width: 1140px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.35rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-light); font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--primary); }
    .hero { text-align: center; padding: 80px 24px 60px; background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 60%, #ecfeff 100%); }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; margin-bottom: 20px; }
    .hero h1 .gradient { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { max-width: 640px; margin: 0 auto 32px; font-size: 1.1rem; color: var(--text-light); }
    .hero-badges { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 36px; }
    .badge { background: #fff; border: 1px solid var(--border); padding: 8px 18px; border-radius: 999px; font-size: 0.9rem; font-weight: 500; color: var(--text-light); }
    section { max-width: 1140px; margin: 0 auto; padding: 60px 24px; }
    .section-title { text-align: center; font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 800; margin-bottom: 12px; }
    .section-subtitle { text-align: center; color: var(--text-light); margin-bottom: 40px; font-size: 1rem; }
    .search-wrap { display: flex; justify-content: center; margin-bottom: 40px; }
    .search-box { position: relative; width: 100%; max-width: 500px; }
    .search-box input { width: 100%; padding: 12px 20px 12px 44px; border: 1px solid var(--border); border-radius: 999px; font-size: 1rem; outline: none; transition: all 0.2s; background: #fff; }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12); }
    .search-box::before { content: "🔍"; position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1rem; pointer-events: none; }
    #view-container { min-height: 400px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 30px 24px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
    .card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent)); transform: scaleX(0); transform-origin: left; transition: transform 0.3s; }
    .card:hover { transform: translateY(-6px); box-shadow: 0 16px 32px rgba(0,0,0,0.08); border-color: transparent; }
    .card:hover::before { transform: scaleX(1); }
    .card-icon { width: 56px; height: 56px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin-bottom: 20px; background: #eef2ff; }
    .card h3 { font-size: 1.2rem; margin-bottom: 10px; font-weight: 700; }
    .card p { color: var(--text-light); font-size: 0.95rem; margin-bottom: 16px; }
    .card-count { font-size: 0.88rem; font-weight: 600; color: var(--primary); }
    .back-btn { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--border); padding: 10px 20px; border-radius: 10px; font-weight: 600; color: var(--text); cursor: pointer; margin-bottom: 24px; transition: all 0.2s; }
    .back-btn:hover { background: #f1f5f9; border-color: var(--primary); color: var(--primary); }
    .soft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .soft-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: flex; flex-direction: column; transition: all 0.28s; }
    .soft-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); border-color: transparent; }
    .soft-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .soft-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; background: #ecfeff; }
    .soft-title { font-size: 1.08rem; font-weight: 700; line-height: 1.3; }
    .soft-version { font-size: 0.8rem; color: var(--text-light); }
    .soft-desc { color: var(--text-light); font-size: 0.92rem; margin-bottom: 14px; flex: 1; }
    .soft-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .soft-tags span { font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; background: #eef2ff; color: var(--primary); font-weight: 600; }
    .soft-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px dashed var(--border); }
    .soft-meta { font-size: 0.8rem; color: var(--text-light); }
    .download-btn { padding: 7px 18px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: background 0.2s; }
    .download-btn:hover { background: var(--primary-dark); }
    .empty { text-align: center; padding: 60px 20px; color: var(--text-light); grid-column: 1 / -1; }
    .empty .emoji { font-size: 3rem; margin-bottom: 16px; display: block; }
    .contact { background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); border-radius: 24px; padding: 60px 32px; text-align: center; color: #fff; margin: 0 auto 60px; max-width: 1092px; }
    .contact .section-title, .contact .section-subtitle { color: #fff; }
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
    .contact-item { background: rgba(255,255,255,0.15); border-radius: 14px; padding: 24px; backdrop-filter: blur(4px); }
    .contact-item .icon { font-size: 1.8rem; margin-bottom: 10px; }
    .contact-item h4 { font-size: 0.95rem; margin-bottom: 6px; opacity: 0.9; }
    .contact-item a, .contact-item span { color: #fff; font-weight: 700; text-decoration: none; word-break: break-all; }
    footer { text-align: center; padding: 32px 24px; border-top: 1px solid var(--border); color: var(--text-light); font-size: 0.9rem; }
    @media (max-width: 700px) { .nav-links { display: none; } .soft-grid, .cards-grid { grid-template-columns: 1fr; } .contact { border-radius: 0; margin-bottom: 0; } }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">震纤软件库</div>
      <ul class="nav-links">
        <li><a href="#welcome">首页</a></li>
        <li><a href="#library">软件库</a></li>
        <li><a href="#contact">联系我</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero" id="welcome">
    <h1>欢迎来到 <span class="gradient">震纤软件库</span></h1>
    <p>精选实用软件，安全、纯净、免费。让你告别捆绑与广告，放心使用每一款工具。</p>
    <div class="hero-badges">
      <span class="badge">✅ 纯净无捆绑</span>
      <span class="badge">🔒 安全可查</span>
      <span class="badge">💯 免费分享</span>
      <span class="badge">⚡ 持续更新</span>
    </div>
  </section>

  <section id="library">
    <h2 class="section-title" id="page-title">软件类型</h2>
    <p class="section-subtitle" id="page-desc">点击任意分类，查看该类型下的全部软件</p>
    
    <div class="search-wrap">
      <div class="search-box">
        <input type="search" id="search-input" placeholder="搜索软件名称或功能...">
      </div>
    </div>

    <div id="view-container">
      <div id="category-view"></div>
      <div id="software-view" style="display: none;"></div>
    </div>
  </section>

  <div class="contact" id="contact">
    <h2 class="section-title">如何联系我</h2>
    <p class="section-subtitle">有问题、有需求、想反馈？随时找我</p>
    <div class="contact-grid">
      <div class="contact-item"><div class="icon">📧</div><h4>邮箱</h4><a href="mailto:121999188@qq.com">121999188@qq.com</a></div>
      <div class="contact-item"><div class="icon">💬</div><h4>微信</h4><span>xy224qw</span></div>
      <div class="contact-item"><div class="icon">🐧</div><h4>QQ</h4><span>121999188</span></div>
      <div class="contact-item"><div class="icon">📢</div><h4>交流群</h4><span>QQ群：88888888</span></div>
    </div>
  </div>

  <footer><p>© 2026 震纤软件库 · 用 ❤ 整理分享 · 本站仅用于学习交流</p></footer>

  <!-- ===================== 干净的 JS 逻辑 ===================== -->
  <script>
    // 全局变量，等待接收后端的数据
    let categories = [];
    let softwares = [];

    // 获取 DOM 元素
    const pageTitle = document.getElementById('page-title');
    const pageDesc = document.getElementById('page-desc');
    const categoryView = document.getElementById('category-view');
    const softwareView = document.getElementById('software-view');
    const searchInput = document.getElementById('search-input');

    // 初始化核心逻辑：从后端拉取数据
    async function init() {
        try {
            // 1. 请求分类数据
            let catRes = await fetch('/api/categories'); // 注意这里用的是相对路径，因为网页和接口在同一个域名
            categories = await catRes.json();

            // 2. 请求软件数据
            let softRes = await fetch('/api/softwares');
            softwares = await softRes.json();

            // 3. 渲染页面
            renderCategories();
            console.log("✅ 数据加载成功！");

        } catch (err) {
            console.error("❌ 后端接口请求失败", err);
            categoryView.innerHTML = `<h3 style="color:red; width:100%; text-align:center;">无法连接后端，请检查终端是否运行了 node server.js</h3>`;
        }
    }

    // 渲染分类大卡片函数
    function renderCategories() {
      pageTitle.innerText = "软件类型";
      pageDesc.innerText = "点击任意分类，查看该类型下的全部软件";
      searchInput.value = ""; 
      
      categoryView.style.display = 'grid';
      categoryView.className = 'cards-grid';
      softwareView.style.display = 'none';

      let html = '';
      categories.forEach(cat => {
        // 计算该分类下有多少个软件
        const count = softwares.filter(s => s.cat === cat.id).length;
        html += `
          <div class="card" onclick="showSoftwares('${cat.id}')">
            <div class="card-icon">${cat.icon}</div>
            <h3>${cat.name}</h3>
            <p>${cat.desc}</p>
            <span class="card-count">共 ${count} 款软件 →</span>
          </div>
        `;
      });
      categoryView.innerHTML = html;
    }

    // 渲染软件列表
    function showSoftwares(catId, keyword = '') {
      categoryView.style.display = 'none';
      softwareView.style.display = 'block';
      
      let list = [];
      let title = '';
      let desc = '';

      if (keyword) {
        const lowerKw = keyword.toLowerCase();
        list = softwares.filter(s => 
          s.name.toLowerCase().includes(lowerKw) || 
          s.desc.toLowerCase().includes(lowerKw) ||
          s.tags.some(t => t.toLowerCase().includes(lowerKw))
        );
        title = `搜索结果`;
        desc = `关键词「${keyword}」，共找到 ${list.length} 款软件`;
      } else {
        const cat = categories.find(c => c.id === catId);
        list = softwares.filter(s => s.cat === catId);
        title = `${cat.icon} ${cat.name}`;
        desc = cat.desc;
      }

      pageTitle.innerText = title;
      pageDesc.innerText = desc;

      let html = `<button class="back-btn" onclick="renderCategories()">← 返回所有类型</button>`;
      
      if (list.length === 0) {
        html += `<div class="empty"><span class="emoji">🔍</span><p>没有找到相关软件</p></div>`;
      } else {
        html += `<div class="soft-grid">`;
        list.forEach(s => {
          html += `
            <div class="soft-card">
              <div class="soft-head">
                <div class="soft-icon">${s.icon}</div>
                <div>
                  <div class="soft-title">${s.name}</div>
                  <div class="soft-version">${s.version}</div>
                </div>
              </div>
              <p class="soft-desc">${s.desc}</p>
              <div class="soft-tags">${s.tags.map(t => `<span>${t}</span>`).join('')}</div>
              <div class="soft-foot">
                <span class="soft-meta">${s.size} · ${s.platform}</span>
                <a href="${s.link}" class="download-btn" target="_blank">下载</a>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      softwareView.innerHTML = html;
    }

    // 绑定搜索事件
    searchInput.addEventListener('input', (e) => {
      const kw = e.target.value.trim();
      if (kw) {
        showSoftwares(null, kw); 
      } else {
        renderCategories(); 
      }
    });

    // 页面加载后立即执行初始化
    init();

  </script>
</body>
</html>
