<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>震纤软件库</title>
  <style>
    /* ===================== 基础重置 ===================== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --accent: #06b6d4;
      --bg: #f8fafc;
      --text: #1e293b;
      --text-light: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    /* ===================== 导航栏 ===================== */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    nav {
      max-width: 1140px; margin: 0 auto; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo {
      font-size: 1.35rem; font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { text-decoration: none; color: var(--text-light); font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: var(--primary); }

    /* ===================== 欢迎横幅 ===================== */
    .hero {
      text-align: center; padding: 80px 24px 60px;
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 60%, #ecfeff 100%);
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 800; margin-bottom: 20px; }
    .hero h1 .gradient {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { max-width: 640px; margin: 0 auto 32px; font-size: 1.1rem; color: var(--text-light); }
    .hero-badges { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 36px; }
    .badge {
      background: #fff; border: 1px solid var(--border); padding: 8px 18px;
      border-radius: 999px; font-size: 0.9rem; font-weight: 500; color: var(--text-light);
    }

    /* ===================== 核心内容区（分类与列表） ===================== */
    section { max-width: 1140px; margin: 0 auto; padding: 60px 24px; }
    .section-title { text-align: center; font-size: clamp(1.6rem, 3.5vw, 2.2rem); font-weight: 800; margin-bottom: 12px; }
    .section-subtitle { text-align: center; color: var(--text-light); margin-bottom: 40px; font-size: 1rem; }

    /* 搜索框 */
    .search-wrap { display: flex; justify-content: center; margin-bottom: 40px; }
    .search-box { position: relative; width: 100%; max-width: 500px; }
    .search-box input {
      width: 100%; padding: 12px 20px 12px 44px;
      border: 1px solid var(--border); border-radius: 999px;
      font-size: 1rem; outline: none; transition: all 0.2s; background: #fff;
    }
    .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12); }
    .search-box::before {
      content: "🔍"; position: absolute; left: 16px; top: 50%;
      transform: translateY(-50%); font-size: 1rem; pointer-events: none;
    }

    /* 视图切换容器 */
    #view-container { min-height: 400px; }

    /* ===== 视图 A：分类卡片 ===== */
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 24px;
    }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 30px 24px; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden;
    }
    .card::before {
      content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transform: scaleX(0); transform-origin: left; transition: transform 0.3s;
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 16px 32px rgba(0,0,0,0.08); border-color: transparent; }
    .card:hover::before { transform: scaleX(1); }
    .card-icon {
      width: 56px; height: 56px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; margin-bottom: 20px; background: #eef2ff;
    }
    .card h3 { font-size: 1.2rem; margin-bottom: 10px; font-weight: 700; }
    .card p { color: var(--text-light); font-size: 0.95rem; margin-bottom: 16px; }
    .card-count { font-size: 0.88rem; font-weight: 600; color: var(--primary); }

    /* ===== 视图 B：软件列表 ===== */
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fff; border: 1px solid var(--border);
      padding: 10px 20px; border-radius: 10px;
      font-weight: 600; color: var(--text); cursor: pointer;
      margin-bottom: 24px; transition: all 0.2s;
    }
    .back-btn:hover { background: #f1f5f9; border-color: var(--primary); color: var(--primary); }
    
    .soft-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .soft-card {
      background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px; display: flex; flex-direction: column; transition: all 0.28s;
    }
    .soft-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); border-color: transparent; }
    .soft-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .soft-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; background: #ecfeff;
    }
    .soft-title { font-size: 1.08rem; font-weight: 700; line-height: 1.3; }
    .soft-version { font-size: 0.8rem; color: var(--text-light); }
    .soft-desc { color: var(--text-light); font-size: 0.92rem; margin-bottom: 14px; flex: 1; }
    .soft-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .soft-tags span { font-size: 0.75rem; padding: 3px 10px; border-radius: 999px; background: #eef2ff; color: var(--primary); font-weight: 600; }
    .soft-foot { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; border-top: 1px dashed var(--border); }
    .soft-meta { font-size: 0.8rem; color: var(--text-light); }
    .download-btn {
      padding: 7px 18px; border-radius: 9px; background: var(--primary);
      color: #fff; font-size: 0.85rem; font-weight: 600; text-decoration: none; transition: background 0.2s;
    }
    .download-btn:hover { background: var(--primary-dark); }

    /* 空状态 */
    .empty { text-align: center; padding: 60px 20px; color: var(--text-light); grid-column: 1 / -1; }
    .empty .emoji { font-size: 3rem; margin-bottom: 16px; display: block; }

    /* ===================== 联系方式与页脚 ===================== */
    .contact {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border-radius: 24px; padding: 60px 32px; text-align: center; color: #fff; margin: 0 auto 60px; max-width: 1092px;
    }
    .contact .section-title, .contact .section-subtitle { color: #fff; }
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
    .contact-item { background: rgba(255,255,255,0.15); border-radius: 14px; padding: 24px; backdrop-filter: blur(4px); }
    .contact-item .icon { font-size: 1.8rem; margin-bottom: 10px; }
    .contact-item h4 { font-size: 0.95rem; margin-bottom: 6px; opacity: 0.9; }
    .contact-item a, .contact-item span { color: #fff; font-weight: 700; text-decoration: none; word-break: break-all; }
    
    footer { text-align: center; padding: 32px 24px; border-top: 1px solid var(--border); color: var(--text-light); font-size: 0.9rem; }

    /* 响应式 */
    @media (max-width: 700px) {
      .nav-links { display: none; }
      .soft-grid, .cards-grid { grid-template-columns: 1fr; }
      .contact { border-radius: 0; margin-bottom: 0; }
    }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <header>
    <nav>

      <ul class="nav-links">

  <!-- 欢迎横幅 -->
  <section class="hero" id="welcome">

  <!-- 联系方式 -->

        <div class="icon">💬</div><h4>微信</h4>
        <span>xy224qw</span>

  </div>

  <!-- 页脚 -->
  <footer>
    <p>© 2026 震纤软件库 · 用 ❤ 整理分享 · 本站仅用于学习交流</p>
  </footer>

  <!-- ===================== 数据与逻辑 ===================== -->
  <script>
    // 1. 分类数据
    const categories = [
      { id: 'system',   name: '文件管理', icon: '🛠️', desc: '系统优化、清理、硬件检测工具' },
      { id: 'office',   name: '办公软件', icon: '📄', desc: '文档处理、PDF转换、笔记与效率' },
      { id: 'media',    name: '视频软件', icon: '🎬', desc: '视频播放、音频处理、剪辑工具' },
      { id: 'design',   name: '图像设计', icon: '🖌️', desc: '图片编辑、截图录屏、设计辅助' },
      { id: 'network',  name: '社交软件', icon: '🌐', desc: '国外社交软件，需要配合VPN使用' },
      { id: 'dev',      name: '开发工具', icon: '💻', desc: '代码编辑器、终端工具、数据库' },
      { id: 'security', name: '安全防护', icon: '🔐', desc: '杀毒防毒、密码管理、隐私保护' },
      { id: 'other',    name: '其他精选', icon: '🎮', desc: '学习、娱乐、实用小工具' }
    ];

    // 2. 软件数据
    const softwares = [
      { cat:'system', name:'MT管理器', icon:'🔍', version:'v2.26.10', size:'35.8 MB', platform:'Windows', desc:' ', tags:['免费','无广告'], link:'https://wwarw.lanzouv.com/b01i5xtlxc' },
      { cat:'system', name:'Geek Uninstaller', icon:'🧹', version:'v1.5.3', size:'3.5 MB', platform:'Windows', desc:'轻量级卸载工具，彻底清理残留文件与注册表。', tags:['免费','纯净'], link:'#' },
      { cat:'system', name:'Dism++', icon:'⚙️', version:'v10.1', size:'10 MB', platform:'Windows', desc:'系统优化与映像管理工具，功能强大界面简洁。', tags:['开源'], link:'#' },
      { cat:'system', name:'火绒安全', icon:'🛡️', version:'v5.0', size:'30 MB', platform:'Windows', desc:'轻量杀毒软件，安静不打扰，有效拦截弹窗广告。', tags:['免费','国产'], link:'#' },
      
      { cat:'office', name:'WPS Office', icon:'📝', version:'2024', size:'250 MB', platform:'全平台', desc:'国产办公套件，兼容 Office 格式，支持云文档同步。', tags:['免费版'], link:'#' },
      { cat:'office', name:'Typora', icon:'✍️', version:'v1.8', size:'15 MB', platform:'全平台', desc:'极简 Markdown 编辑器，所见即所得的写作体验。', tags:['付费','轻量'], link:'#' },
      { cat:'office', name:'Obsidian', icon:'🗂️', version:'v1.5', size:'80 MB', platform:'全平台', desc:'本地化知识管理工具，双向链接构建知识网络。', tags:['免费'], link:'#' },
      
      { cat:'media', name:'YouTude', icon:'▶️', version:'v21.39.522', size:'137.81 MB', platform:'Windows', desc:'全能视频播放器，支持几乎全部格式，播放流畅。', tags:['免费'], link:'https://share.feijipan.com/s/D4x3Kxt7' },
      { cat:'media', name:'OBS Studio', icon:'🎥', version:'v30', size:'200 MB', platform:'全平台', desc:'专业直播与录屏软件，支持多场景切换与混音。', tags:['开源'], link:'#' },
      
      { cat:'design', name:'Snipaste', icon:'✂️', version:'v2.8', size:'15 MB', platform:'Win/macOS', desc:'截图与贴图神器，标注、取色、贴图一气呵成。', tags:['免费'], link:'#' },
      { cat:'design', name:'GIMP', icon:'🎨', version:'v2.10', size:'200 MB', platform:'全平台', desc:'开源图像处理软件，Photoshop 的免费替代品。', tags:['开源'], link:'#' },
      
      { cat:'network', name:'X', icon:'🌐', version:'v12.31.0', size:'183.28 MB', platform:'移动端', desc:' ', tags:['免费'], link:'https://share.feijipan.com/s/Wjx3K4ks' },
      { cat:'network', name:'Telegram', icon:'🖥️', version:'v12.10.6', size:'40 MB', platform:'移动端', desc:' ', tags:['免费版'], link:'https://share.feijipan.com/s/mTx3JHsG' },
	  { cat:'network', name:'', icon:'🌐', version:'v12.31.0', size:'183.28 MB', platform:'移动端', desc:' ', tags:['免费'], link:'https://share.feijipan.com/s/Wjx3K4ks' },
      
      { cat:'dev', name:'VS Code', icon:'💻', version:'v1.85', size:'90 MB', platform:'全平台', desc:'微软出品的代码编辑器，插件生态强大。', tags:['免费','开源'], link:'#' },
      { cat:'dev', name:'Postman', icon:'🚀', version:'v10', size:'150 MB', platform:'全平台', desc:'API 调试与测试工具，支持接口集合与测试。', tags:['免费版'], link:'#' },
      
      { cat:'security', name:'Bitwarden', icon:'🔑', version:'v2024', size:'10 MB', platform:'全平台', desc:'开源密码管理器，端到端加密，多设备同步。', tags:['免费','开源'], link:'#' },
      { cat:'security', name:'VeraCrypt', icon:'🔒', version:'v1.25', size:'40 MB', platform:'全平台', desc:'开源磁盘加密工具，为敏感数据提供强加密。', tags:['开源'], link:'#' },
      
      { cat:'other', name:'Notion', icon:'📓', version:'v3', size:'100 MB', platform:'全平台', desc:'全能笔记与协作工具，文档、表格一站搞定。', tags:['免费版'], link:'#' },
      { cat:'other', name:'滴答清单', icon:'✅', version:'v6', size:'60 MB', platform:'全平台', desc:'待办事项与时间管理工具，日程安排清晰高效。', tags:['免费版'], link:'#' }
    ];
 
    // 3. 获取 DOM 元素
    const pageTitle = document.getElementById('page-title');
    const pageDesc = document.getElementById('page-desc');
    const categoryView = document.getElementById('category-view');
    const softwareView = document.getElementById('software-view');
    const searchInput = document.getElementById('search-input');

    // 4. 渲染分类大卡片
    function renderCategories() {
      pageTitle.innerText = "软件类型";
      pageDesc.innerText = "点击任意分类，查看该类型下的全部软件";
      searchInput.value = ""; // 清空搜索
      
      categoryView.style.display = 'grid'; // 恢复网格布局
      categoryView.className = 'cards-grid';
      softwareView.style.display = 'none';

      let html = '';
      categories.forEach(cat => {
        // 计算该分类下有多少软件
        const count = softwares.filter(s => s.cat === cat.id).length;
        html += `
          <div class="card" onclick="showSoftwares('${cat.id}')">
            <div class="card-icon">${cat.icon}</div>
            <h3>${cat.name}</h3>
            <p>${cat.desc}</p>
            <span class="card-count">共 ${count} 款软件 →</span>
          </div>
        `;
      });
      categoryView.innerHTML = html;
    }

    // 5. 渲染具体软件列表
    function showSoftwares(catId, keyword = '') {
      categoryView.style.display = 'none';
      softwareView.style.display = 'block';
      
      let list = [];
      let title = '';
      let desc = '';

      if (keyword) {
        // 搜索模式
        const lowerKw = keyword.toLowerCase();
        list = softwares.filter(s => 
          s.name.toLowerCase().includes(lowerKw) || 
          s.desc.toLowerCase().includes(lowerKw) ||
          s.tags.some(t => t.toLowerCase().includes(lowerKw))
        );
        title = `搜索结果`;
        desc = `关键词「${keyword}」，共找到 ${list.length} 款软件`;
      } else {
        // 分类模式
        const cat = categories.find(c => c.id === catId);
        list = softwares.filter(s => s.cat === catId);
        title = `${cat.icon} ${cat.name}`;
        desc = cat.desc;
      }

      pageTitle.innerText = title;
      pageDesc.innerText = desc;

      // 生成返回按钮（搜索时不显示返回按钮，显示清空按钮即可）
      let html = `<button class="back-btn" onclick="renderCategories()">← 返回所有类型</button>`;
      
      if (list.length === 0) {
        html += `
          <div class="empty">
            <span class="emoji">🔍</span>
            <p>没有找到相关软件，换个关键词试试吧</p>
          </div>`;
      } else {
        html += `<div class="soft-grid">`;
        list.forEach(s => {
          html += `
            <div class="soft-card">
              <div class="soft-head">
                <div class="soft-icon">${s.icon}</div>
                <div>
                  <div class="soft-title">${s.name}</div>
                  <div class="soft-version">${s.version}</div>
                </div>
              </div>
              <p class="soft-desc">${s.desc}</p>
              <div class="soft-tags">
                ${s.tags.map(t => `<span>${t}</span>`).join('')}
              </div>
              <div class="soft-foot">
                <span class="soft-meta">${s.size} · ${s.platform}</span>
                <a href="${s.link}" class="download-btn" target="_blank">下载</a>
              </div>
            </div>
          `;
        });
        html += `</div>`;
      }
      softwareView.innerHTML = html;
    }

    // 6. 绑定搜索事件
    searchInput.addEventListener('input', (e) => {
      const kw = e.target.value.trim();
      if (kw) {
        showSoftwares(null, kw); // 进入搜索视图
      } else {
        // 如果清空了搜索框，判断当前是不是在列表页
        // 简化处理：直接返回分类总览
        renderCategories(); 
      }
    });

    // 7. 初始化页面
    renderCategories();

  </script>
</body>
</html>
